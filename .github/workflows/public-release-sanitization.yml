name: Public Release Sanitization

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: pip install -e .

      - name: Run public release validation
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          release_notes_arg=""
          if [ -f RELEASE_NOTES.md ]; then
            release_notes_arg="--release-notes-file RELEASE_NOTES.md"
          fi
          python -m mr_lint.public_release check \
            --config policy/public-release-sanitization.yml \
            --root . \
            --summary "$PR_BODY" \
            $release_notes_arg \
            --markdown-output public-release-report.md \
            --json-output public-release-report.json

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-release-validation
          path: |
            public-release-report.md
            public-release-report.json

  generate-public-changelog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: pip install -e .

      - name: Generate merge title list
        run: git log --format=%s > merge-titles.txt

      - name: Generate sanitized changelog
        run: |
          python -m mr_lint.public_release changelog \
            --config policy/public-release-sanitization.yml \
            --merge-titles-file merge-titles.txt \
            --changelog-output public-changelog.md \
            --markdown-output public-changelog-report.md \
            --json-output public-changelog-report.json

      - name: Upload changelog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-changelog
          path: |
            merge-titles.txt
            public-changelog.md
            public-changelog-report.md
            public-changelog-report.json
