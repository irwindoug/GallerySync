name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './vendor/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi
          for f in "${files[@]}"; do
            php -l "$f"
          done

  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker dependencies
        run: npm install

      - name: Worker typecheck
        run: npm run typecheck
