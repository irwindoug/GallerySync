name: Stripe Webhook Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          WORKER_PUBLIC_URL: ${{ secrets.WORKER_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::Missing STRIPE_SECRET_KEY secret."
            missing=1
          fi
          if [ -z "${WORKER_PUBLIC_URL:-}" ]; then
            echo "::error::Missing WORKER_PUBLIC_URL secret (example: https://your-worker.workers.dev)."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "Add required secrets, then rerun this workflow."
            exit 1
          fi

      - name: Create webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          WORKER_PUBLIC_URL: ${{ secrets.WORKER_PUBLIC_URL }}
        run: |
          set -euo pipefail
          endpoint_url="${WORKER_PUBLIC_URL%/}/stripe/webhook"

          response=$(curl -sS https://api.stripe.com/v1/webhook_endpoints \
            -u "${STRIPE_SECRET_KEY}:" \
            -d "url=${endpoint_url}" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=customer.subscription.created" \
            -d "enabled_events[]=customer.subscription.updated" \
            -d "enabled_events[]=customer.subscription.deleted")

          secret=$(printf '%s' "$response" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('secret',''))")
          endpoint_id=$(printf '%s' "$response" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('id',''))")
          error_msg=$(printf '%s' "$response" | python3 -c "import json,sys; data=json.load(sys.stdin); err=data.get('error') or {}; print(err.get('message',''))")

          if [ -n "$error_msg" ]; then
            echo "::error::Stripe API error: $error_msg"
            exit 1
          fi

          if [ -z "$secret" ]; then
            echo "::warning::Webhook endpoint may already exist. No signing secret returned."
            echo "Open Stripe Dashboard and copy the endpoint signing secret into Cloudflare as STRIPE_WEBHOOK_SECRET."
            exit 0
          fi

          echo "::add-mask::$secret"
          echo "Webhook endpoint created: $endpoint_id"
          echo "Save the endpoint signing secret as Cloudflare Worker secret STRIPE_WEBHOOK_SECRET before receiving events."
          echo "Secret fingerprint: ${secret:0:6}...${secret: -4}"
