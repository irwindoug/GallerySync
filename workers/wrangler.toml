name = "gallery-sync-workers"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Replace the placeholder ids below with your own Cloudflare KV namespace ids
# (`wrangler kv:namespace create LICENSES` / `... EVENTS`).
[[kv_namespaces]]
binding = "LICENSES"
id = "<YOUR_LICENSES_KV_ID>"
preview_id = "<YOUR_LICENSES_KV_PREVIEW_ID>"

[[kv_namespaces]]
binding = "EVENTS"
id = "<YOUR_EVENTS_KV_ID>"
preview_id = "<YOUR_EVENTS_KV_PREVIEW_ID>"

[vars]
# Non-secret configuration (if needed).
# STRIPE_PRICE_SEATS_BASIC = ""
# STRIPE_PRICE_SEATS_PRO = ""

[env.staging]
name = "gallery-sync-workers-staging"
