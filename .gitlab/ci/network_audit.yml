# Network Audit Jobs
#
# Phase matrix:
#
#   Job                      Phase 1      Phase 2      Phase 3
#   npm_route_inventory      advisory     advisory     advisory (informational)
#   npm_auth_coverage        advisory     advisory     BLOCKING
#
# npm_route_inventory is always informational — its artifact is the deliverable,
# not the exit code. npm_auth_coverage can promote to blocking when the NPM
# config is fully tracked in this repository.
#
# NPM here refers to nginx-proxy-manager, not Node Package Manager.

.find_npm_configs: &find_npm_configs |
  # Collect compose files that look like NPM deployments and any nginx proxy
  # host config files tracked in the repository.
  npm_compose=$(find . -type f \
    \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \
    -o -name 'compose.yml' -o -name 'compose.yaml' \) \
    ! -path './.git/*' \
    | xargs grep -lE '(nginx-proxy-manager|jlesage/nginx-proxy-manager|nginxproxymanager)' 2>/dev/null \
    | sort || true)
  npm_proxy_confs=$(find . -type f -name '*.conf' ! -path './.git/*' \
    | xargs grep -lE '(proxy_pass|location\s+/)' 2>/dev/null \
    | sort || true)
  mkdir -p policy-reports

npm_route_inventory:
  extends:
    - .default_job
    - .branch_or_mr
    - .advisory   # Informational: exit code never blocks pipeline
  stage: network-audit
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - *find_npm_configs
    - |
      report="policy-reports/npm-route-inventory.json"
      summary="policy-reports/npm-route-inventory-summary.txt"
    - |
      python3 - "$npm_compose" "$npm_proxy_confs" << 'PYEOF'
      import sys, re, yaml, json, os

      compose_files = [f for f in sys.argv[1].split('\n') if f.strip()]
      conf_files = [f for f in sys.argv[2].split('\n') if f.strip()]

      inventory = {
          "compose_services": [],
          "nginx_proxy_hosts": [],
          "summary": {}
      }

      # Extract NPM service definitions from compose files
      for filepath in compose_files:
          try:
              with open(filepath) as fh:
                  compose = yaml.safe_load(fh)
          except Exception as e:
              print(f"WARN: could not parse {filepath}: {e}")
              continue
          services = compose.get('services') or {}
          for svc_name, svc in services.items():
              if not svc:
                  continue
              image = svc.get('image', '')
              if not re.search(r'nginx.?proxy.?manager|nginxproxymanager', image, re.IGNORECASE):
                  continue
              ports = svc.get('ports') or []
              volumes = svc.get('volumes') or []
              networks = list((svc.get('networks') or {}).keys()) if isinstance(
                  svc.get('networks'), dict) else (svc.get('networks') or [])
              inventory["compose_services"].append({
                  "file": filepath,
                  "service": svc_name,
                  "image": image,
                  "ports": [str(p) for p in ports],
                  "volumes": [str(v) for v in volumes],
                  "networks": networks
              })

      # Parse nginx proxy host .conf files for upstream routes
      server_name_re = re.compile(r'server_name\s+([^;]+);')
      proxy_pass_re = re.compile(r'proxy_pass\s+(https?://[^\s;]+)')
      ssl_cert_re = re.compile(r'ssl_certificate\s+([^;]+);')
      auth_basic_re = re.compile(r'auth_basic\s+["\']([^"\']+)["\']')

      for filepath in conf_files:
          with open(filepath) as fh:
              content = fh.read()
          server_names = server_name_re.findall(content)
          upstreams = proxy_pass_re.findall(content)
          ssl = bool(ssl_cert_re.search(content))
          auth = bool(auth_basic_re.search(content))
          if server_names or upstreams:
              inventory["nginx_proxy_hosts"].append({
                  "file": filepath,
                  "server_names": [n.strip() for n in ' '.join(server_names).split()],
                  "upstreams": upstreams,
                  "ssl": ssl,
                  "auth_basic": auth
              })

      inventory["summary"] = {
          "npm_compose_services": len(inventory["compose_services"]),
          "nginx_proxy_hosts_found": len(inventory["nginx_proxy_hosts"]),
          "routes_without_ssl": sum(
              1 for h in inventory["nginx_proxy_hosts"] if not h["ssl"]
          ),
          "routes_without_auth": sum(
              1 for h in inventory["nginx_proxy_hosts"] if not h["auth_basic"]
          ),
      }

      with open("policy-reports/npm-route-inventory.json", 'w') as f:
          json.dump(inventory, f, indent=2)

      summary_lines = [
          "NPM Route Inventory",
          "=" * 40,
          f"NPM compose services: {inventory['summary']['npm_compose_services']}",
          f"Nginx proxy host configs: {inventory['summary']['nginx_proxy_hosts_found']}",
          f"Routes without SSL: {inventory['summary']['routes_without_ssl']}",
          f"Routes without auth_basic: {inventory['summary']['routes_without_auth']}",
          "",
      ]
      for host in inventory["nginx_proxy_hosts"]:
          ssl_flag = "SSL" if host["ssl"] else "NO-SSL"
          auth_flag = "AUTH" if host["auth_basic"] else "NO-AUTH"
          for name in host.get("server_names", ["(unknown)"]):
              for upstream in host.get("upstreams", ["(unknown)"]):
                  summary_lines.append(f"  [{ssl_flag}][{auth_flag}] {name} -> {upstream}")
      if not inventory["nginx_proxy_hosts"]:
          summary_lines.append(
              "  No nginx proxy host configs found in repository.\n"
              "  If NPM config is managed outside this repo, this job is informational only."
          )

      summary_text = '\n'.join(summary_lines)
      with open("policy-reports/npm-route-inventory-summary.txt", 'w') as f:
          f.write(summary_text)
      print(summary_text)
      PYEOF
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - policy-reports/npm-route-inventory.json
      - policy-reports/npm-route-inventory-summary.txt

npm_auth_coverage:
  extends:
    - .default_job
    - .branch_or_mr
  stage: network-audit
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - *find_npm_configs
    - |
      report="policy-reports/npm-auth-coverage.txt"
    - |
      python3 - "$npm_proxy_confs" << 'PYEOF'
      import sys, re, os

      conf_files = [f for f in sys.argv[1].split('\n') if f.strip()]
      report_path = "policy-reports/npm-auth-coverage.txt"

      if not conf_files:
          with open(report_path, 'w') as f:
              f.write("SKIP: no nginx proxy host configs found in repository.\n")
          print("SKIP: no nginx proxy host configs found.")
          sys.exit(0)

      # Routes that are exempt from auth requirement (e.g. public-facing by design)
      PUBLIC_EXCEPTION = re.compile(r'policy-exception:\s*public-route', re.IGNORECASE)
      server_name_re = re.compile(r'server_name\s+([^;]+);')
      auth_basic_re = re.compile(r'auth_basic\s+["\']([^"\']+)["\']')
      auth_request_re = re.compile(r'auth_request\s+')

      issues = []
      for filepath in conf_files:
          with open(filepath) as fh:
              content = fh.read()
          if PUBLIC_EXCEPTION.search(content):
              continue
          has_auth = bool(auth_basic_re.search(content)) or bool(auth_request_re.search(content))
          if not has_auth:
              names = server_name_re.findall(content)
              display = ', '.join(n.strip() for n in ' '.join(names).split()) if names else filepath
              issues.append(f"  {filepath}: '{display}' has no auth_basic or auth_request")

      with open(report_path, 'w') as rpt:
          if issues:
              rpt.write("FAIL: proxy routes without authentication:\n")
              rpt.write('\n'.join(issues) + '\n')
              rpt.write(
                  "\nRemediation: add auth_basic or forward-auth (auth_request) to each route.\n"
                  "Exception: add '# policy-exception: public-route <justification>'\n"
                  "  for intentionally public endpoints.\n"
              )
              print('\n'.join(["FAIL: unauthenticated proxy routes:"] + issues))
              sys.exit(1)
          else:
              rpt.write("PASS: all proxy routes have authentication configured.\n")
              print("PASS: all proxy routes have auth coverage.")
      PYEOF
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/npm-auth-coverage.txt

network_membership_check_placeholder:
  extends:
    - .default_job
    - .branch_or_mr
    - .advisory
  stage: network-audit
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - |
      python -m mr_lint.network_membership_check \
        --config policy/network-membership-policy.yml \
        --markdown-output policy-reports/network-membership-check.md \
        --json-output policy-reports/network-membership-check.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/network-membership-check.md
      - policy-reports/network-membership-check.json
