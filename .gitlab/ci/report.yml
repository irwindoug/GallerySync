# Policy Report Jobs
#
# Collects artifacts from all audit jobs and publishes a consolidated
# policy summary. Always runs regardless of upstream failures.
#
# The policy_report job:
#   - Aggregates all policy-reports/*.txt files
#   - Produces a markdown summary suitable for MR notes or archival
#   - Never blocks the pipeline (informational artifact only)
#
# The policy_report_on_main job:
#   - Same as above but only runs on main/release refs
#   - Suitable for dashboarding or feeding into a compliance record

.collect_reports: &collect_reports |
  mkdir -p policy-reports
  summary_file="policy-reports/policy-summary.md"
  {
    echo "# Policy Audit Summary"
    echo ""
    echo "Pipeline: \${CI_PIPELINE_ID:-local}"
    echo "Ref: \${CI_COMMIT_REF_NAME:-unknown}"
    echo "Commit: \${CI_COMMIT_SHORT_SHA:-unknown}"
    echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
    echo ""
    echo "---"
    echo ""
  } > "$summary_file"

  pass_count=0
  fail_count=0
  skip_count=0
  advisory_fail_count=0

  for report_file in policy-reports/*.txt; do
    [ -f "$report_file" ] || continue
    [ "$report_file" = "$summary_file" ] && continue
    job_name="$(basename "$report_file" .txt)"
    first_line="$(head -n 1 "$report_file")"
    status_icon="?"
    case "$first_line" in
      PASS*)  status_icon="PASS";  pass_count=$((pass_count + 1)) ;;
      FAIL*)  status_icon="FAIL";  fail_count=$((fail_count + 1)) ;;
      SKIP*)  status_icon="SKIP";  skip_count=$((skip_count + 1)) ;;
      INFO*)  status_icon="INFO";  pass_count=$((pass_count + 1)) ;;
      *)      status_icon="?";     advisory_fail_count=$((advisory_fail_count + 1)) ;;
    esac
    {
      echo "## \`$job_name\`"
      echo ""
      echo "\`\`\`"
      cat "$report_file"
      echo "\`\`\`"
      echo ""
    } >> "$summary_file"
  done

  {
    echo "---"
    echo ""
    echo "## Totals"
    echo ""
    echo "| Status | Count |"
    echo "|--------|-------|"
    echo "| PASS   | $pass_count |"
    echo "| FAIL   | $fail_count |"
    echo "| SKIP   | $skip_count |"
    echo "| UNKNOWN | $advisory_fail_count |"
    echo ""
    if [ "$fail_count" -gt 0 ]; then
      echo "> **$fail_count check(s) failed.** Review the sections above."
    else
      echo "> All checks passed or were skipped."
    fi
  } >> "$summary_file"

  echo "Policy summary written to $summary_file"
  echo "  PASS: $pass_count  FAIL: $fail_count  SKIP: $skip_count"

policy_report:
  extends:
    - .default_job
  stage: report
  image: alpine:3.20
  when: always
  needs:
    - job: compose_image_tags
      artifacts: true
      optional: true
    - job: compose_secret_sprawl
      artifacts: true
      optional: true
    - job: mount_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_dangerous_mounts
      artifacts: true
      optional: true
    - job: compose_port_exposure
      artifacts: true
      optional: true
    - job: port_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_host_network
      artifacts: true
      optional: true
    - job: host_network_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_network_segmentation
      artifacts: true
      optional: true
    - job: npm_route_inventory
      artifacts: true
      optional: true
    - job: npm_auth_coverage
      artifacts: true
      optional: true
    - job: network_membership_check_placeholder
      artifacts: true
      optional: true
    - job: secret_audit_placeholder
      artifacts: true
      optional: true
    - job: public_release_validate
      artifacts: true
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - *collect_reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - policy-reports/policy-summary.md
      - policy-reports/

policy_report_on_main:
  extends:
    - .default_job
  stage: report
  image: alpine:3.20
  when: always
  needs:
    - job: compose_image_tags
      artifacts: true
      optional: true
    - job: compose_secret_sprawl
      artifacts: true
      optional: true
    - job: mount_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_dangerous_mounts
      artifacts: true
      optional: true
    - job: compose_port_exposure
      artifacts: true
      optional: true
    - job: port_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_host_network
      artifacts: true
      optional: true
    - job: host_network_policy_check_placeholder
      artifacts: true
      optional: true
    - job: compose_network_segmentation
      artifacts: true
      optional: true
    - job: npm_route_inventory
      artifacts: true
      optional: true
    - job: npm_auth_coverage
      artifacts: true
      optional: true
    - job: network_membership_check_placeholder
      artifacts: true
      optional: true
    - job: secret_audit_placeholder
      artifacts: true
      optional: true
    - job: public_release_validate
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|master|release\/.+)$/
  script:
    - *collect_reports
    - |
      echo "Archiving policy report for ref: ${CI_COMMIT_REF_NAME}"
      # Extend this step to push the report to an S3 bucket, pages, or compliance store.
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - policy-reports/policy-summary.md
      - policy-reports/
