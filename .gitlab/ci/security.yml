# Security Jobs
#
# Phase matrix:
#
#   Job                      Phase 1      Phase 2      Phase 3
#   secret_audit             BLOCKING     BLOCKING     BLOCKING
#
# Replace secret_audit_placeholder with a repo-aware scanner when a
# policy config tied to real secrets sources is available.

secret_audit_placeholder:
  extends:
    - .default_job
    - .branch_or_mr
  stage: security
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - |
      python -m mr_lint.secret_audit \
        --config policy/secret-audit.yml \
        --markdown-output policy-reports/secret-audit.md \
        --json-output policy-reports/secret-audit.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/secret-audit.md
      - policy-reports/secret-audit.json
