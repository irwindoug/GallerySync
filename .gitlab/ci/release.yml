# Release Jobs
#
# public_release_validate runs on branch and MR pipelines to catch public-release
# issues before a release ref is cut.
#
# public_release_gate runs on release refs and uses the same YAML policy config,
# plus merge-title validation and changelog generation.

public_release_validate:
  allow_failure: true
  extends:
    - .default_job
    - .branch_or_mr
  stage: validate
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - |
      release_notes_arg=""
      if [ -f RELEASE_NOTES.md ]; then
        release_notes_arg="--release-notes-file RELEASE_NOTES.md"
      fi
      python -m mr_lint.public_release check \
        --config policy/public-release-sanitization.yml \
        --root . \
        --summary "${CI_MERGE_REQUEST_DESCRIPTION:-}" \
        $release_notes_arg \
        --markdown-output policy-reports/public-release-validate.md \
        --json-output policy-reports/public-release-validate.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - policy-reports/public-release-validate.md
      - policy-reports/public-release-validate.json

public_release_gate:
  extends:
    - .default_job
    - .release_refs_only
  stage: release
  image: python:3.12-alpine
  script:
    - apk add --no-cache git
    - pip install --quiet pyyaml
    - git log --format=%s > public-release-merge-titles.txt
    - |
      release_notes_arg=""
      if [ -f RELEASE_NOTES.md ]; then
        release_notes_arg="--release-notes-file RELEASE_NOTES.md"
      fi
      python -m mr_lint.public_release check \
        --config policy/public-release-sanitization.yml \
        --root . \
        $release_notes_arg \
        --merge-titles-file public-release-merge-titles.txt \
        --changelog-output public-changelog.md \
        --markdown-output policy-reports/public-release-gate.md \
        --json-output policy-reports/public-release-gate.json
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - policy-reports/public-release-gate.md
      - policy-reports/public-release-gate.json
      - public-release-merge-titles.txt
      - public-changelog.md

# Generates a manifest of all tracked files in the release tree.
# Attached as artifact for human review (Gate 7).
public_release_manifest:
  extends:
    - .default_job
    - .release_refs_only
  stage: release
  image: alpine:3.20
  needs:
    - public_release_gate
  script:
    - |
      ref="${CI_COMMIT_TAG:-${CI_COMMIT_BRANCH}}"
      printf 'Release manifest for ref: %s\n' "$ref"
      printf 'Generated: %s\n\n' "$(date -u)"
      find . -type f ! -path './.git/*' | sort | \
        while IFS= read -r f; do
          size=$(wc -c < "$f" 2>/dev/null || echo "?")
          printf '%8s  %s\n' "$size" "$f"
        done
      printf '\nTotal files: %d\n' "$(find . -type f ! -path './.git/*' | wc -l)"
  artifacts:
    name: "release-manifest-${CI_COMMIT_REF_SLUG}"
    when: always
    expire_in: 365 days
    paths:
      - "release-manifest.txt"
  after_script:
    - |
      ref="${CI_COMMIT_TAG:-${CI_COMMIT_BRANCH}}"
      find . -type f ! -path './.git/*' | sort > release-manifest.txt
      echo "" >> release-manifest.txt
      printf 'Total: %d files | Ref: %s | Date: %s\n' \
        "$(find . -type f ! -path './.git/*' | wc -l)" \
        "$ref" "$(date -u)" >> release-manifest.txt

# Sanitize and push to GitHub.
# Runs only when:
#   - PUBLIC_RELEASE_ENABLED == "true"    (CI variable, set in project settings)
#   - Triggered manually (when: manual)
#   - GITHUB_REPO_URL is set              (deploy key configured)
# This job NEVER runs automatically — it always requires human approval.
public_release_publish:
  extends:
    - .default_job
    - .release_refs_only
  stage: release
  image: alpine:3.20
  when: manual
  needs:
    - public_release_gate
    - public_release_manifest
  rules:
    - if: $PUBLIC_RELEASE_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
  before_script:
    - set -eu
    - apk add --no-cache git openssh-client bash
    - |
      [[ -n "${GITHUB_REPO_URL:-}" ]] || { echo "GITHUB_REPO_URL not set"; exit 1; }
      [[ -n "${GITHUB_DEPLOY_KEY:-}" ]] || { echo "GITHUB_DEPLOY_KEY not set"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "${GITHUB_DEPLOY_KEY}" ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      echo "Publishing version: ${version}"
      bash scripts/publish.sh \
        --source-ref "${CI_COMMIT_TAG}" \
        --github-remote github \
        "${version}"
  environment:
    name: github-public
    url: $GITHUB_REPO_URL
