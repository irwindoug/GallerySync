# ── Phase 3: advisory now → BLOCKING Phase 3 ─────────────────────────────────

compose_host_network:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: alpine:3.20
  script:
    - *find_compose_files
    - |
      report="policy-reports/compose-host-network.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping host network check." | tee "$report"
        exit 0
      fi
      : > "$report"
      printf '%s\n' "$compose_files" | while IFS= read -r file; do
        [ -n "$file" ] || continue
        hits=$(grep -nE '^\s+network_mode:\s+["\x27]?host["\x27]?' "$file" || true)
        [ -n "$hits" ] || continue
        # Write hits to a per-file temp file to avoid nested pipe subshell on inner loop
        hits_tmp="/tmp/hn_hits_$$"
        printf '%s\n' "$hits" > "$hits_tmp"
        while IFS= read -r hit; do
          lineno=$(printf '%s' "$hit" | cut -d: -f1)
          start=$((lineno - 5))
          [ "$start" -lt 1 ] && start=1
          context=$(sed -n "${start},${lineno}p" "$file")
          if ! printf '%s' "$context" | grep -qiE 'policy-exception:[[:space:]]*host-network'; then
            printf 'FAIL [%s:%s]: network_mode: host without exception comment:\n' "$file" "$lineno" >> "$report"
            printf '  %s\n' "$hit" >> "$report"
          else
            printf 'SKIP [%s:%s]: host-network exception approved.\n' "$file" "$lineno" >> "$report"
          fi
        done < "$hits_tmp"
        rm -f "$hits_tmp"
      done
      if grep -q '^FAIL' "$report" 2>/dev/null; then
        {
          echo ""
          echo "Remediation: avoid host networking where possible."
          echo "  If required (e.g. RustDesk TURN, Tailscale), add above the service:"
          echo "    # policy-exception: host-network <justification>"
        } >> "$report"
        cat "$report"
        exit 1
      fi
      echo "PASS: all host-network usages are documented exceptions." >> "$report"
      cat "$report"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-host-network.txt

