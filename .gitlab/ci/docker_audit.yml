compose_network_segmentation:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - *find_compose_files
    - |
      report="policy-reports/compose-network-segmentation.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping network segmentation check." | tee "$report"
        exit 0
      fi
    - |
      python3 - "$compose_files" << 'PYEOF'
      import sys, re, yaml

      # Policy: a service SHOULD NOT appear on more than MAX_NETWORKS networks
      # unless it is a known bridge/proxy role with an exception comment.
      MAX_NETWORKS = 2
      EXCEPTION_PATTERN = re.compile(r'policy-exception:\s*multi-network', re.IGNORECASE)
      # Known gateway roles that legitimately span networks
      GATEWAY_ROLES = re.compile(r'(proxy|gateway|relay|router|bridge|ingress|egress)', re.IGNORECASE)

      files = [f for f in sys.argv[1].split('\n') if f.strip()]
      issues = []
      warnings = []

      for filepath in files:
          try:
              with open(filepath) as fh:
                  raw = fh.read()
              compose = yaml.safe_load(raw)
          except Exception as e:
              print(f"WARN: could not parse {filepath}: {e}")
              continue

          file_exception = EXCEPTION_PATTERN.search(raw)
          services = compose.get('services') or {}

          for svc_name, svc in services.items():
              if not svc:
                  continue
              networks = svc.get('networks') or []
              if isinstance(networks, dict):
                  network_list = list(networks.keys())
              elif isinstance(networks, list):
                  network_list = [str(n) for n in networks]
              else:
                  continue

              if len(network_list) <= MAX_NETWORKS:
                  continue

              if file_exception or GATEWAY_ROLES.search(svc_name):
                  warnings.append(
                      f"  {filepath}: '{svc_name}' spans {len(network_list)} networks "
                      f"({', '.join(network_list)}) — exception or gateway role accepted"
                  )
              else:
                  issues.append(
                      f"  {filepath}: '{svc_name}' spans {len(network_list)} networks "
                      f"({', '.join(network_list)}) — exceeds MAX_NETWORKS={MAX_NETWORKS}"
                  )

      report_path = "policy-reports/compose-network-segmentation.txt"
      with open(report_path, 'w') as rpt:
          if warnings:
              rpt.write("INFO: gateway/exception services spanning multiple networks:\n")
              rpt.write('\n'.join(warnings) + '\n\n')
          if issues:
              rpt.write("FAIL: services spanning too many networks (possible trust-zone mixing):\n")
              rpt.write('\n'.join(issues) + '\n')
              rpt.write(
                  "\nRemediation: split services so each connects to at most "
                  f"{MAX_NETWORKS} networks.\n"
                  "Exception: add '# policy-exception: multi-network <justification>' "
                  "or use a service name that includes 'proxy', 'relay', or 'gateway'.\n"
              )
              print('\n'.join(["FAIL: network segmentation violations:"] + issues))
              sys.exit(1)
          else:
              rpt.write("PASS: all services respect network segmentation policy.\n")
              print("PASS: network segmentation OK.")
      PYEOF
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-network-segmentation.txt
