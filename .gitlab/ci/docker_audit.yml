# Docker Platform Audit Jobs
#
# Phase matrix (flip allow_failure: false when phase is reached):
#
#   Job                          Phase 1      Phase 2      Phase 3
#   compose_image_tags           BLOCKING     BLOCKING     BLOCKING
#   compose_secret_sprawl        advisory     BLOCKING     BLOCKING
#   compose_dangerous_mounts     advisory     BLOCKING     BLOCKING
#   compose_port_exposure        advisory     BLOCKING     BLOCKING
#   compose_host_network         advisory     advisory     BLOCKING
#   compose_network_segmentation advisory     advisory     BLOCKING
#
# To promote a job from advisory to blocking:
#   1. Remove the "extends: .advisory" mixin (or change allow_failure to false)
#   2. Update docs/ci-policy-phases.md to record the phase promotion date
#   3. Announce in the MR that triggered the promotion
#
# All jobs write a plain-text report to policy-reports/ for artifact collection.

.find_compose_files: &find_compose_files |
  compose_files="$(find . -type f \
    \( -name 'docker-compose.yml' \
    -o -name 'docker-compose.yaml' \
    -o -name 'compose.yml' \
    -o -name 'compose.yaml' \) \
    ! -path './.git/*' | sort)"
  mkdir -p policy-reports

# ── Phase 1: BLOCKING ────────────────────────────────────────────────────────

compose_image_tags:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: alpine:3.20
  script:
    - *find_compose_files
    - |
      report="policy-reports/compose-image-tags.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping image tag check." | tee "$report"
        exit 0
      fi
      : > "$report"
      printf '%s\n' "$compose_files" | while IFS= read -r file; do
        [ -n "$file" ] || continue
        hits=$(grep -nE 'image:.*:latest' "$file" || true)
        [ -n "$hits" ] || continue
        # Check each hit: skip if the preceding non-empty line contains
        # # policy-exception: latest-tag
        printf '%s\n' "$hits" | while IFS= read -r hit; do
          lineno=$(printf '%s' "$hit" | cut -d: -f1)
          # Look back up to 3 lines for an exception comment
          start=$((lineno - 3))
          [ "$start" -lt 1 ] && start=1
          context=$(sed -n "${start},$((lineno - 1))p" "$file")
          if printf '%s' "$context" | grep -qiE 'policy-exception:[[:space:]]*latest-tag'; then
            printf 'SKIP [%s:%s]: latest-tag exception approved.\n' "$file" "$lineno" >> "$report"
          else
            printf 'FAIL [%s] :latest image tag forbidden:\n' "$file" >> "$report"
            printf '  %s\n' "$hit" >> "$report"
          fi
        done
      done
      if grep -q '^FAIL' "$report" 2>/dev/null; then
        echo "Pin all images to a specific digest or version tag." >> "$report"
        cat "$report"
        exit 1
      fi
      echo "PASS: no :latest tags found." > "$report"
      cat "$report"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-image-tags.txt

# ── Phase 2: advisory now → BLOCKING Phase 2 ─────────────────────────────────

compose_secret_sprawl:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: python:3.12-alpine
  script:
    - *find_compose_files
    - |
      report="policy-reports/compose-secret-sprawl.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping secret sprawl check." | tee "$report"
        exit 0
      fi
    - |
      python3 - "$compose_files" << 'PYEOF'
      import sys, re, os

      # Env var names that suggest credential material
      SECRET_PATTERN = re.compile(
          r'(?i)(password|passwd|secret|token|api[_-]?key|private[_-]?key|credential|auth[_-]?key|access[_-]?key)',
          re.IGNORECASE
      )
      # Values that look like literal secrets (not variable references)
      LITERAL_VALUE = re.compile(
          r'=\s*(?!\$\{)(?!\"?\$)(?!\${)(?!<)(?!REPLACE)(?!YOUR_)(?!CHANGE_ME)(?!example)(?!placeholder)[^\s"\']{6,}',
          re.IGNORECASE
      )
      EXCEPTION_MARKER = re.compile(r'policy-exception:\s*inline-secret', re.IGNORECASE)

      files = [f for f in sys.argv[1].split('\n') if f.strip()]
      found_issues = []

      for filepath in files:
          with open(filepath) as fh:
              lines = fh.readlines()
          file_exception = any(EXCEPTION_MARKER.search(ln) for ln in lines)
          if file_exception:
              continue
          for i, line in enumerate(lines, 1):
              if SECRET_PATTERN.search(line) and LITERAL_VALUE.search(line):
                  # Skip lines that set via variable reference or are commented
                  stripped = line.strip()
                  if stripped.startswith('#'):
                      continue
                  if '${' in line or line.strip().endswith('""') or line.strip().endswith("''"):
                      continue
                  found_issues.append(f"  {filepath}:{i}: {stripped}")

      report_path = "policy-reports/compose-secret-sprawl.txt"
      with open(report_path, 'w') as rpt:
          if found_issues:
              rpt.write("FAIL: potential inline secrets in compose files:\n")
              rpt.write('\n'.join(found_issues) + '\n')
              rpt.write("\nRemediation: use env_file, Docker secrets, or external secret injection.\n")
              rpt.write("Exception: add '# policy-exception: inline-secret' comment in the file.\n")
              print('\n'.join(["FAIL: potential inline secrets:"] + found_issues))
              sys.exit(1)
          else:
              rpt.write("PASS: no inline secrets detected in compose files.\n")
              print("PASS: no inline secrets detected.")
      PYEOF
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-secret-sprawl.txt

