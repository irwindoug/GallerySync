compose_dangerous_mounts:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: alpine:3.20
  script:
    - *find_compose_files
    - |
      report="policy-reports/compose-dangerous-mounts.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping dangerous mount check." | tee "$report"
        exit 0
      fi
      : > "$report"
      # Dangerous host paths: docker socket, kernel interfaces, host root, /etc
      DANGEROUS='^[[:space:]]+-[[:space:]]+(\/var\/run\/docker\.sock|\/proc:|\/sys:|\/dev:|\/etc:|\/root:|\/run\/containerd)'
      DANGEROUS_SOURCE='^[[:space:]]+source:[[:space:]]+(\/var\/run\/docker\.sock|\/proc|\/sys|\/dev|\/etc|\/root)'
      printf '%s\n' "$compose_files" | while IFS= read -r file; do
        [ -n "$file" ] || continue
        if grep -qiE 'policy-exception:[[:space:]]*dangerous-mount' "$file"; then
          echo "SKIP [$file]: policy-exception: dangerous-mount found" >> "$report"
          continue
        fi
        hits_short=$(grep -nE "$DANGEROUS" "$file" || true)
        hits_long=$(grep -nE "$DANGEROUS_SOURCE" "$file" || true)
        if [ -n "$hits_short" ] || [ -n "$hits_long" ]; then
          printf 'FAIL [%s]: dangerous host mount detected:\n' "$file" >> "$report"
          [ -n "$hits_short" ] && printf '%s\n' "$hits_short" >> "$report"
          [ -n "$hits_long" ] && printf '%s\n' "$hits_long" >> "$report"
        fi
      done
      if grep -q '^FAIL' "$report" 2>/dev/null; then
        {
          echo ""
          echo "Remediation:"
          echo "  - Use named volumes instead of host bind mounts where possible."
          echo "  - If docker.sock is required (e.g. CI agent), add:"
          echo "    # policy-exception: dangerous-mount <justification>"
        } >> "$report"
        cat "$report"
        exit 1
      fi
      echo "PASS: no dangerous host mounts detected." > "$report"
      cat "$report"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-dangerous-mounts.txt

compose_port_exposure:
  extends:
    - .default_job
    - .branch_or_mr
  stage: docker-audit
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - *find_compose_files
    - |
      report="policy-reports/compose-port-exposure.txt"
      if [ -z "$compose_files" ]; then
        echo "No compose files found — skipping port exposure check." | tee "$report"
        exit 0
      fi
    - |
      python3 - "$compose_files" << 'PYEOF'
      import sys, re, yaml

      # Ports not bound to 127.0.0.1 are visible on all interfaces
      # Exceptions: 0.0.0.0 is acceptable for intentionally public services
      # with a policy-exception comment or a known-public label

      EXCEPTION_PATTERN = re.compile(r'policy-exception:\s*public-port', re.IGNORECASE)

      # Port forms that bind to all interfaces without an explicit host
      # "8080:8080" or 8080:8080 (unquoted) — implicitly 0.0.0.0
      IMPLICIT_ALL = re.compile(r'^"?\'?(?!127\.0\.0\.1:)(?!\d+\.\d+\.\d+\.\d+:)(\d+):(\d+)"?\'?$')

      files = [f for f in sys.argv[1].split('\n') if f.strip()]
      issues = []

      for filepath in files:
          try:
              with open(filepath) as fh:
                  raw = fh.read()
              compose = yaml.safe_load(raw)
          except Exception as e:
              print(f"WARN: could not parse {filepath}: {e}")
              continue

          file_exception = EXCEPTION_PATTERN.search(raw)
          if file_exception:
              continue

          services = compose.get('services') or {}
          for svc_name, svc in services.items():
              if not svc:
                  continue
              ports = svc.get('ports') or []
              for port in ports:
                  port_str = str(port).strip()
                  # Long-form port definition
                  if isinstance(port, dict):
                      host_ip = port.get('host_ip', '')
                      if host_ip in ('', '0.0.0.0'):
                          published = port.get('published', '')
                          target = port.get('target', '')
                          issues.append(
                              f"  {filepath}: service '{svc_name}' port "
                              f"{published}:{target} binds to all interfaces"
                          )
                      continue
                  # Short-form: "8080:8080" or "0.0.0.0:8080:8080"
                  if IMPLICIT_ALL.match(port_str):
                      issues.append(
                          f"  {filepath}: service '{svc_name}' port '{port_str}' "
                          f"binds to all interfaces (use 127.0.0.1:{port_str} for internal services)"
                      )
                  elif port_str.startswith('0.0.0.0:'):
                      issues.append(
                          f"  {filepath}: service '{svc_name}' port '{port_str}' "
                          f"explicit 0.0.0.0 binding"
                      )

      report_path = "policy-reports/compose-port-exposure.txt"
      with open(report_path, 'w') as rpt:
          if issues:
              rpt.write("FAIL: ports exposed on all interfaces (0.0.0.0):\n")
              rpt.write('\n'.join(issues) + '\n')
              rpt.write(
                  "\nRemediation: bind internal services to 127.0.0.1:<host>:<container>.\n"
                  "Exception: add '# policy-exception: public-port <justification>' "
                  "to the compose file for intentionally public services.\n"
              )
              print('\n'.join(["FAIL: wide-open port bindings:"] + issues))
              sys.exit(1)
          else:
              rpt.write("PASS: all ports are explicitly bound to a host interface.\n")
              print("PASS: all ports are explicitly bound.")
      PYEOF
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - policy-reports/compose-port-exposure.txt

port_policy_check_placeholder:
  extends:
    - .default_job
    - .branch_or_mr
    - .advisory
  stage: docker-audit
